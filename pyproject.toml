[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blocklock-lab"
version = "0.1.0"
description = "Reproducing BlockLock: batch-geometry-induced nondeterminism in LLM inference, and the fixed-geometry fix — on CPU with real bf16 arithmetic."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
